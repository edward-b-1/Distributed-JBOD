# Three djbod nodes and the web UI on one machine, for trying the system
# out. Not a production layout: the six "devices" are Docker volumes on one
# disk, which is why DJBOD_ALLOW_SHARED_FILESYSTEM is set.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   open http://127.0.0.1:5264/            (DJBOD_UI_PORT=... to publish elsewhere)
#   docker compose -f deploy/docker-compose.yml exec node1 djbod status
#   docker compose -f deploy/docker-compose.yml down -v      # and delete the data
#
# Nodes are addressed by IP and port in the cluster document, so each
# service has a fixed address on a private network. The cluster id and
# node ids below are ordinary UUIDs; change them if you run two of these.
# See docs/deployment.md.

x-node: &node
  build:
    context: ..
  image: djbod:local
  restart: unless-stopped
  environment: &node-env
    DJBOD_CLUSTER_ID: 3d1e7b3a-0c3f-4b0e-9a7f-1a2b3c4d5e6f
    DJBOD_ALLOW_SHARED_FILESYSTEM: "true"

services:
  node1:
    <<: *node
    environment:
      <<: *node-env
      DJBOD_NODE_ID: 11111111-1111-4111-8111-111111111111
      DJBOD_ADVERTISE: 172.28.0.11:5263
      DJBOD_K: "2"
      DJBOD_M: "1"
    networks:
      djbod:
        ipv4_address: 172.28.0.11
    volumes:
      - node1-state:/var/lib/djbod
      - node1-d0:/data/d0
      - node1-d1:/data/d1

  node2:
    <<: *node
    depends_on: [node1]
    environment:
      <<: *node-env
      DJBOD_NODE_ID: 22222222-2222-4222-8222-222222222222
      DJBOD_ADVERTISE: 172.28.0.12:5263
      DJBOD_JOIN_PEER: 172.28.0.11:5263
      DJBOD_BOOTSTRAP_PEERS: 172.28.0.11:5263,172.28.0.13:5263
    networks:
      djbod:
        ipv4_address: 172.28.0.12
    volumes:
      - node2-state:/var/lib/djbod
      - node2-d0:/data/d0
      - node2-d1:/data/d1

  node3:
    <<: *node
    depends_on: [node1]
    environment:
      <<: *node-env
      DJBOD_NODE_ID: 33333333-3333-4333-8333-333333333333
      DJBOD_ADVERTISE: 172.28.0.13:5263
      DJBOD_JOIN_PEER: 172.28.0.11:5263
      DJBOD_BOOTSTRAP_PEERS: 172.28.0.11:5263,172.28.0.12:5263
    networks:
      djbod:
        ipv4_address: 172.28.0.13
    volumes:
      - node3-state:/var/lib/djbod
      - node3-d0:/data/d0
      - node3-d1:/data/d1

  ui:
    image: djbod:local
    depends_on: [node1]
    restart: unless-stopped
    entrypoint: ["djbod-ui"]
    command: ["--listen", "0.0.0.0:5264"]
    environment:
      DJBOD_NODE: 172.28.0.11:5263
      DJBOD_CLUSTER: 3d1e7b3a-0c3f-4b0e-9a7f-1a2b3c4d5e6f
    ports:
      # Published on localhost only. Set DJBOD_UI_PORT if 5264 is taken on
      # the host, for example by a djbod-ui already running there.
      - "127.0.0.1:${DJBOD_UI_PORT:-5264}:5264"
    networks:
      djbod:
        ipv4_address: 172.28.0.20

networks:
  djbod:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  node1-state:
  node1-d0:
  node1-d1:
  node2-state:
  node2-d0:
  node2-d1:
  node3-state:
  node3-d0:
  node3-d1:
