[package]
name = "djbod-python"
description = "The Distributed-JBOD client for Python, wrapping djbod-client with PyO3"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# An extension module links against the interpreter that loads it, so it
# has no test or doc-test binaries; the Python tests exercise it.
test = false
doctest = false
bench = false

[dependencies]
djbod-client = { workspace = true }
djbod-core = { workspace = true }
djbod-proto = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pythonize = "0.29"
uuid = { workspace = true }
time = { workspace = true }

[lints]
workspace = true
