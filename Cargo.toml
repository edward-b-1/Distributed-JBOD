[workspace]
resolver = "2"
members = ["crates/djbod-core", "crates/djbod-proto", "crates/djbod-node", "crates/djbod-cli", "crates/djbod-recover"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
reed-solomon-erasure = "6.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
rustix = { version = "1", features = ["fs"] }
ciborium = "0.2"
djbod-core = { path = "crates/djbod-core" }
djbod-proto = { path = "crates/djbod-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "time", "fs"] }
djbod-node = { path = "crates/djbod-node" }
toml = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.10"
anyhow = "1"
tempfile = "3"

# Project style: an explicit index loop is preferred over an iterator chain
# when the index itself is meaningful (a shard index, a position in a
# pattern). Clippy's suggestion to rewrite such loops with enumerate() and
# skip() is not wanted.
[workspace.lints.clippy]
needless_range_loop = "allow"
