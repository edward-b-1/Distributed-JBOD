[workspace]
resolver = "2"
members = ["crates/djbod-core", "crates/djbod-proto", "crates/djbod-client", "crates/djbod-node", "crates/djbod-cli", "crates/djbod-recover", "crates/djbod-ui", "crates/djbod-python"]

[workspace.package]
version = "0.2.12"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
reed-solomon-erasure = "6.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
thiserror = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }
rustix = { version = "1", features = ["fs"] }
ciborium = "0.2"
djbod-core = { path = "crates/djbod-core" }
djbod-proto = { path = "crates/djbod-proto" }
djbod-client = { path = "crates/djbod-client" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "macros", "time", "fs"] }
djbod-node = { path = "crates/djbod-node" }
toml = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.10"
anyhow = "1"
tempfile = "3"
axum = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
djbod-ui = { path = "crates/djbod-ui" }
comfy-table = { version = "8", default-features = false }
unicode-width = { version = "0.2", default-features = false }

# Project style: an explicit index loop is preferred over an iterator chain
# when the index itself is meaningful (a shard index, a position in a
# pattern). Clippy's suggestion to rewrite such loops with enumerate() and
# skip() is not wanted.
[workspace.lints.clippy]
needless_range_loop = "allow"
